[package]
name = "amm"
version = "0.1.0"
description = "Simple AMM program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]
default = []

[dependencies]
anchor-lang = { version = "0.31.0", features = ["init-if-needed"] }

[dev-dependencies]
litesvm = "0.12.0"
solana-address = "2.6"
solana-instruction = "3.4"
solana-keypair = "3.1"
solana-message = "3.1"
solana-signer = "3.0"
solana-transaction = "3.0"
